{% extends "base.html" %}
{% block title %}Editar mis datos{% endblock %}
{% block content %}
<a href="/dashboard" class="text-sm text-gray-500 hover:text-emerald-600">← Volver</a>

<div class="max-w-sm bg-white rounded-xl shadow p-6 mt-4">
    <h1 class="text-xl font-bold mb-4">Editar mis datos</h1>

    {% if error %}
    <p class="bg-red-100 text-red-700 text-sm rounded p-2 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" action="/dashboard/editar" class="space-y-3">
        <div>
            <label class="text-sm font-medium">Nombre completo</label>
            <input type="text" name="full_name" value="{{ user.full_name }}" required
                   class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm font-medium">Email</label>
            <input type="email" name="email" value="{{ user.email }}" required
                   class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm font-medium">Teléfono</label>
            <input type="tel" name="phone" value="{{ user.phone or '' }}"
                   placeholder="Ej: 351 555 1234"
                   class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <button class="w-full bg-emerald-600 text-white rounded py-2 font-medium hover:bg-emerald-700">
            Guardar cambios
        </button>
    </form>
</div>
{% endblock %}
