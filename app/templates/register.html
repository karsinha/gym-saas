{% extends "base.html" %}
{% block title %}Registrarse{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow p-6">
    <h1 class="text-xl font-bold mb-4">Crear cuenta</h1>

    {% if error %}
    <p class="bg-red-100 text-red-700 text-sm rounded p-2 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" action="/register" class="space-y-3">
        <div>
            <label class="text-sm font-medium">Nombre completo</label>
            <input type="text" name="full_name" required class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm font-medium">Email</label>
            <input type="email" name="email" required class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm font-medium">Contraseña</label>
            <input type="password" name="password" required class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <button class="w-full bg-emerald-600 text-white rounded py-2 font-medium hover:bg-emerald-700">
            Crear cuenta
        </button>
    </form>

    <p class="text-xs text-gray-400 mt-4">
        Nota: el primer usuario que se registre en el sistema queda como administrador automáticamente.
    </p>
</div>
{% endblock %}
