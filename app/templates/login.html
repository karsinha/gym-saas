{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto bg-white rounded-xl shadow p-6">
    <h1 class="text-xl font-bold mb-4">Iniciar sesión</h1>

    {% if error %}
    <p class="bg-red-100 text-red-700 text-sm rounded p-2 mb-4">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="space-y-3">
        <div>
            <label class="text-sm font-medium">Email</label>
            <input type="email" name="email" required class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <div>
            <label class="text-sm font-medium">Contraseña</label>
            <input type="password" name="password" required class="w-full border rounded px-3 py-2 mt-1">
        </div>
        <button class="w-full bg-emerald-600 text-white rounded py-2 font-medium hover:bg-emerald-700">
            Entrar
        </button>
    </form>

    <p class="text-sm text-gray-500 mt-4">
        ¿No tenés cuenta? <a href="/register" class="text-emerald-600 font-medium">Registrate</a>
    </p>
</div>
{% endblock %}
